name: .NET Monorepo DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master", "feature/*" ]
    paths:
      - '**'
      - '.github/workflows/dotnet-pipeline.yml'
      - '.github/action/dotnet-build-and-scan/action.yml'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  packages: write

jobs:
  build-test-scan-publish:
    name: Build, Scan, Auto-Tag & Package .NET Suite
    runs-on: self-hosted

    steps:
    # 1. Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Panggil Composite Action (Build, Test & Sonar Scan)
    - name: Run .NET Build and Scan Composite Action
      uses: ./.github/action/dotnet-build-and-scan
      with:
        dotnet-version: '10.0.401'
        solution-file: 'ProtelindoDotNetSuite.slnx' # Konsisten menggunakan file .slnx
        sonar-project-key: 'ProtelindoDotNetSuite'
        sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
        sonar-token: ${{ secrets.SONAR_TOKEN }}

    # 3. AUTO GIT TAGGING
    - name: Bump Version and Push Git Tag
      id: autotag
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch
        RELEASE_BRANCHES: main,master

    # 4. Publish Web API Artifact
    - name: Publish MyWebApi
      run: dotnet publish MyWebApi/MyWebApi.csproj -c Release -o ./publish/webapi --no-build

    # 5. Upload Artifact
    - name: Upload WebAPI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapi-${{ steps.autotag.outputs.new_tag || github.sha }}
        path: publish/webapi/
        retention-days: 7

    # 6. AUTO DOCKER TAGGING & PUSH
    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Metadata & Auto-Tag Docker Image
      id: docker_meta
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/protelindo-webapi
        tags: |
          type=raw,value=${{ steps.autotag.outputs.new_tag }}
          type=raw,value=latest
          type=sha,format=short

    - name: Build and Push Docker Image
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: MyWebApi/Dockerfile
        push: true
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}