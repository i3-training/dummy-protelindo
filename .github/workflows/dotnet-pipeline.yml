name: .NET Monorepo DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master", "feature/*" ]
    paths:
      - '**'
      - '.github/workflows/dotnet-pipeline.yml'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  packages: write

jobs:
  build-test-scan-publish:
    name: Build, Scan, Auto-Tag & Package .NET Suite
    runs-on: self-hosted

    # HAPUS ATAU KOMENTAR BAGIAN DEFAULTS WORKING DIRECTORY INI:
    # defaults:
    #   run:
    #     working-directory: ProtelindoDotNetSuite

    steps:
    # 1. Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Setup .NET 8 SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restore Dependencies
    - name: Restore Dependencies
      run: dotnet restore ProtelindoDotNetSuite.slnx

    # 4. Install & Run SonarQube Scanner
    - name: Install SonarScanner
      run: |
        dotnet tool install --global dotnet-sonarscanner || true
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: SonarQube Begin
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        dotnet-sonarscanner begin \
          /k:"ProtelindoDotNetSuite" \
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

    # 5. Build Solution
    - name: Build Solution
      run: dotnet build ProtelindoDotNetSuite.sln -c Release --no-restore

    # 6. Run Unit Tests
    - name: Run Tests
      run: |
        dotnet test ProtelindoDotNetSuite.sln -c Release --no-build \
          --collect:"XPlat Code Coverage" || true

    # 7. End SonarQube Analysis
    - name: SonarQube End
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

    # 8. AUTO GIT TAGGING
    - name: Bump Version and Push Git Tag
      id: autotag
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch
        RELEASE_BRANCHES: main,master

    # 9. Publish Web API Artifact
    - name: Publish MyWebApi
      run: dotnet publish MyWebApi/MyWebApi.csproj -c Release -o ./publish/webapi --no-build

    # 10. Upload Artifact (Path disesuaikan tanpa prefix ProtelindoDotNetSuite)
    - name: Upload WebAPI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapi-${{ steps.autotag.outputs.new_tag || github.sha }}
        path: publish/webapi/
        retention-days: 7

    # 11. AUTO DOCKER TAGGING & PUSH
    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract Metadata & Auto-Tag Docker Image
      id: docker_meta
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/protelindo-webapi
        tags: |
          type=raw,value=${{ steps.autotag.outputs.new_tag }}
          type=raw,value=latest
          type=sha,format=short

    - name: Build and Push Docker Image
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: MyWebApi/Dockerfile
        push: true
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}